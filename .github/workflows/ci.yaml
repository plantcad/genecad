# CI: lint and test
name: ci

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main, refine-CrossEntropyLoss ]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: |
          uv sync --group dev --extra test
      - name: Verify torch-dependent tests can actually run
        # Guards against a repeat of the bug this fixes: test_frame_crf.py and
        # test_dataset.py both gate on `pytest.importorskip("torch")`, so if
        # this import ever silently breaks again, those files go quiet
        # (skipped, not failed) and `uv run pytest` below still exits 0.
        run: |
          uv run python -c "import torch, lightning, torchmetrics; from src import modeling"
      - name: Run pre-commit
        run: |
          uv run pre-commit run --all-files
      - name: Run tests
        run: |
          uv run pytest
